name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the source
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releasenote/release_notes_${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES does not exist. Write the release notes before tagging."
            exit 1
          fi
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $VERSION, app/build.gradle.kts says $DECLARED."
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Restore the signing key
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE is not set. Nothing can be signed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee build-output.txt
      - name: Build
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee -a build-output.txt
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          cp "$APK" "SonderWeb-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "SonderWeb-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SonderWeb $VERSION" \
            --notes-file docs/releasenote/release_notes_$GITHUB_REF_NAME.md
      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build-output.txt
          gh release view ci-failure --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-failure --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Last CI failure" --notes "Replaced on every failed build."
          { echo "$GITHUB_WORKFLOW on $GITHUB_REF_NAME at $GITHUB_SHA"; tail -n 300 build-output.txt; } > failure.txt
          gh release upload ci-failure failure.txt --repo "$GITHUB_REPOSITORY" --clobber
